name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      LEDGERMIND_AUTH_DISABLED: '1'
      LEDGERMIND_DATA_DIR: /tmp/ledger-ci-state
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: node scripts/test_reserve_projection.mjs
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/check_warnings.py
